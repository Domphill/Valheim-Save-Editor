name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  build-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --onefile --windowed --name ValheimSaveEditor --icon assets/icon.ico --clean app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ValheimSaveEditor-windows
          path: dist/ValheimSaveEditor.exe

  # Pushing a tag like v1.2.3 publishes a GitHub release with the exe and its SHA-256.
  release:
    needs: build-exe
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags, to find the previous release
      - uses: actions/download-artifact@v4
        with:
          name: ValheimSaveEditor-windows
          path: dist
      - name: Checksum and release notes
        # The notes cover every CHANGELOG section newer than the previous release tag, so
        # several versions pushed together all appear in the one release.
        run: |
          (cd dist && sha256sum ValheimSaveEditor.exe > ValheimSaveEditor.exe.sha256 && cat ValheimSaveEditor.exe.sha256)
          python3 - <<'EOF'
          import os, re, subprocess
          def ver(s):
              return tuple(int(p) for p in re.findall(r"\d+", s)[:3])
          current = ver(os.environ["GITHUB_REF_NAME"])
          tags = [ver(t) for t in subprocess.run(["git", "tag", "--list", "v*"], capture_output=True, text=True).stdout.split()]
          older = [t for t in tags if t < current]
          previous = max(older) if older else (0, 0, 0)
          text = open("CHANGELOG.md", encoding="utf-8").read()
          parts = []
          for m in re.finditer(r"^## (\d+\.\d+\.\d+)\b([^\n]*)\n(.*?)(?=^## |\Z)", text, re.S | re.M):
              v = ver(m.group(1))
              if previous < v <= current:
                  parts.append("### %s%s\n\n%s" % (m.group(1), m.group(2), m.group(3).strip()))
          body = "\n\n".join(parts) if parts else "See CHANGELOG.md."
          body += ("\n\n`ValheimSaveEditor.exe.sha256` is the SHA-256 of the exe, which was built by this "
                   "repository's CI from the tagged source. Windows SmartScreen warns about any unsigned "
                   "download; running from source needs only Python with tkinter.")
          open("release_notes.md", "w", encoding="utf-8").write(body)
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          name: Valheim Save Editor ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            dist/ValheimSaveEditor.exe
            dist/ValheimSaveEditor.exe.sha256
