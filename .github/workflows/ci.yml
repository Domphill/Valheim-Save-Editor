name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  build-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --onefile --windowed --name ValheimSaveEditor --icon assets/icon.ico --clean app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ValheimSaveEditor-windows
          path: dist/ValheimSaveEditor.exe

  # Pushing a tag like v1.2.3 publishes a GitHub release with the exe and its SHA-256.
  release:
    needs: build-exe
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ValheimSaveEditor-windows
          path: dist
      - name: Checksum and release notes
        run: |
          (cd dist && sha256sum ValheimSaveEditor.exe > ValheimSaveEditor.exe.sha256 && cat ValheimSaveEditor.exe.sha256)
          python3 - <<'EOF'
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## %s\b[^\n]*\n(.*?)(?=^## |\Z)" % re.escape(version), text, re.S | re.M)
          body = m.group(1).strip() if m else "See CHANGELOG.md."
          body += ("\n\n`ValheimSaveEditor.exe.sha256` is the SHA-256 of the exe, which was built by this "
                   "repository's CI from the tagged source. Windows SmartScreen warns about any unsigned "
                   "download; running from source needs only Python with tkinter.")
          open("release_notes.md", "w", encoding="utf-8").write(body)
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          name: Valheim Save Editor ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            dist/ValheimSaveEditor.exe
            dist/ValheimSaveEditor.exe.sha256
